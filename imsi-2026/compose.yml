services:

  database:
    image: postgres:18-alpine

    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}

    volumes:
      - batman:/var/lib/postgresql/

    networks:
      - imsi-rp

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend

    image: imsi-backend:2.0

    environment:
      DB_USER: ${PGUSER}
      DB_PASS: ${PGPASSWORD}
      DB_HOST: database
      DB_NAME: ${PGDATABASE}
      DB_PORT: ${PGPORT}

    networks:
      - imsi-rp

    ports:
      - "3000:3000"

    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    image: imsi-frontend:0.2
    networks:
      - imsi-rp
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://localhost:8080 || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

volumes:
  batman:

networks:
  imsi-rp:
  